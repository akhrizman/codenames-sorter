<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codenames Cards</title>

  <link rel="stylesheet" type="text/css" href="./css/style.css" media="screen" />
  <script src="./js/index.js" defer></script>

</head>

<body>

<div class="container">

  <h1>Codenames Card Sorter</h1>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Search for a word..."
      autocomplete="off"
      autofocus
    >
  </div>

  <div id="resultCount"></div>

  <div id="results"></div>

  <div class="instructions">
    Search the front, back, deck, or position of a card.
    <br>
    Examples: Pitch, King, Tooth...
  </div>

</div>

</body>
</html>
