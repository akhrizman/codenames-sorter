  <title>Codenames Cards</title>

  <link rel="stylesheet" type="text/css" href="./css/style.css" media="screen" />


</head>

<body>

  <h1>Codenames Cards</h1>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Search for a word..."
      autocomplete="off"
      autofocus
    >
  </div>

  <div id="resultCount"></div>

  <div id="results"></div>

  <div class="instructions">
    Search the front, back, deck, or position of a card.
    <br>
    Examples: Pitch, King, Tooth...
  </div>

</div>

   */

    { position: "98", front: "OPERA", back: "PYRAMID" },
    { position: "99", front: "TOWER", back: "POISON" },
    { position: "100", front: "NIGHT", back: "STRING" }
  ].map(card => ({
    ...card,
    deck: "Deck 2"
  }));


  /*
   * Combine both decks.
   */

  const cards = [...deck1, ...deck2];


  /*
   * ============================================
   * SEARCH
   * ============================================
   */

  const searchInput = document.getElementById("searchInput");
  const resultsContainer = document.getElementById("results");
  const resultCount = document.getElementById("resultCount");


  function searchCards() {

    const query = searchInput.value.trim().toLowerCase();

    /*
     * Nothing entered yet.
     */

    if (query === "") {

      resultsContainer.innerHTML = `
          <div class="no-results">
            Start typing to search the cards.
          </div>
        `;

      resultCount.textContent = "";

      return;
    }


    /*
     * Search:
     *
     * - Front of Card
     * - Back of Card
     * - Deck
     * - Position
     */

    const matches = cards.filter(card => {

      return (
        card.front.toLowerCase().includes(query) ||
        card.back.toLowerCase().includes(query) ||
        card.deck.toLowerCase().includes(query) ||
        card.position.toLowerCase().includes(query)
      );

    });


    resultCount.textContent =
      `${matches.length} ${matches.length === 1 ? "result" : "results"}`;


    /*
     * No matches.
     */

    if (matches.length === 0) {

      resultsContainer.innerHTML = `
          <div class="no-results">
            No cards found.
          </div>
        `;

      return;
    }


    /*
     * Display each match as:
     *
     * FRONT OF CARD | BACK OF CARD
     * ----------------------------
     * DECK          | POSITION
     */

    resultsContainer.innerHTML = matches.map(card => `

        <div class="result-card">

          <div class="card-cell front">
            <span class="label">Front of Card</span>
            <span class="value">
              ${escapeHtml(card.front)}
            </span>
          </div>

          <div class="card-cell back">
            <span class="label">Back of Card</span>
            <span class="value">
              ${escapeHtml(card.back)}
            </span>
          </div>

          <div class="card-cell deck">
            <span class="label">Deck</span>
            <span class="value ${card.deck === "Deck 1" ? "deck-1" : "deck-2"}">
              ${escapeHtml(card.deck)}
            </span>
          </div>

          <div class="card-cell position">
            <span class="label">Position</span>
            <span class="value">
              ${escapeHtml(card.position)}
            </span>
          </div>

        </div>

      `).join("");

  }


  /*
   * ============================================
   * HTML ESCAPING
   * ============================================
   */

  function escapeHtml(value) {

    return value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * Search as the user types.
   */

  searchInput.addEventListener("input", searchCards);


  /*
   * Initial page state.
   */

  searchCards();

</script>
